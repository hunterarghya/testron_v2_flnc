[project]
name = "testron-backend"
version = "0.1.0"
description = "API for the coaching center test platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.4",
]

[tool.uv]
# An application, not a library: nothing to build or install
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--strict-markers --strict-config"
# Tests never read the developer's .env. "D:" values are defaults that CI may override.
env = [
    "DJANGO_ENV=test",
    "MEDIA_BACKEND=local",
    "D:SECRET_KEY=test-only-secret-key",
    "D:DATABASE_URL=postgres://app:app@localhost:5432/app",
    "D:ASSIGNMENT_PASSWORD_KEY=dGVzdC1vbmx5LWFzc2lnbm1lbnQtcHcta2V5LTAwMDE=",
    "D:OTP_HMAC_KEY=test-only-otp-hmac-key",
]
