[project]
name = "testron-backend"
version = "0.1.0"
description = "API for the coaching center test platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "factory-boy>=3.3.3",
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.4",
    "ruff>=0.17.3",
]

[tool.uv]
# An application, not a library: nothing to build or install
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--strict-markers --strict-config"
# The CI check scripts in ../scripts are tested here too
pythonpath = [".", "../scripts"]
testpaths = ["core", "config", "modules", "tests"]
# Tests never read the developer's .env. "D:" values are defaults that CI may override.
env = [
    "DJANGO_ENV=test",
    "MEDIA_BACKEND=local",
    "D:SECRET_KEY=test-only-secret-key",
    "D:DATABASE_URL=postgres://app:app@localhost:5432/app",
    "D:ASSIGNMENT_PASSWORD_KEY=dGVzdC1vbmx5LWFzc2lnbm1lbnQtcHcta2V5LTAwMDE=",
    "D:OTP_HMAC_KEY=test-only-otp-hmac-key",
]

# --- Lint and format (project_structure.md §1) ---
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "T20", "RUF",
    "C90",  # S-02 complexity
    "PL",   # S-01 statements, S-03 parameters
    "ERA",  # Y-03 no commented-out code
    "TID",  # Y-06 absolute imports; clock reads only in core/clock.py
    "DTZ",  # V1 F-34 no naive datetimes
    "S",    # bandit security checks
    "DJ", "PT",
]
# Errors are named after the condition (AttemptEnded, StageClosed), not "...Error"
# (project_structure.md §1.3)
ignore = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 6

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "modules", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Read the time from core.clock (or ctx.now) so tests can control it"
"datetime.datetime.utcnow".msg = "Read the time from core.clock (or ctx.now) so tests can control it"
"django.utils.timezone.now".msg = "Read the time from core.clock (or ctx.now) so tests can control it"

[tool.ruff.lint.per-file-ignores]
"core/clock.py" = ["TID251"]  # the one place allowed to read the system clock
"**/tests/**" = ["S101", "S105", "S106", "PLR2004"]  # asserts, fake secrets and literal values
"conftest.py" = ["S101"]

# --- Types (Y-01) ---
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# No `Any` in business code (Y-01)
[[tool.mypy.overrides]]
module = ["modules.*.domain.*", "modules.*.services.*", "modules.*.policies"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
ignore_missing_imports = true

# --- Boundaries (project_structure.md §4.1) ---
[tool.importlinter]
root_packages = ["core", "modules", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Module dependency order"
type = "layers"
layers = [
    "modules.housekeeping",
    "modules.results",
    "modules.grading",
    "modules.delivery",
    "modules.assignments",
    "modules.authoring | modules.students",
    "modules.tagging | modules.media | modules.identity | modules.audit",
    "core",
]

[[tool.importlinter.contracts]]
name = "Layers inside a module"
type = "layers"
containers = [
    "modules.identity", "modules.students", "modules.tagging", "modules.media",
    "modules.authoring", "modules.assignments", "modules.delivery", "modules.grading",
    "modules.results", "modules.audit", "modules.housekeeping",
]
layers = [
    "(routes)",
    "(controllers)",
    "(dto)",
    "(services)",
    "(policies)",
    "(repositories)",
    "(models)",
    "(domain)",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["modules.*.domain"]
forbidden_modules = ["django", "ninja", "core.db", "core.http", "core.mail", "core.config"]

[[tool.importlinter.contracts]]
name = "Services are HTTP-free"
type = "forbidden"
source_modules = ["modules.*.services"]
forbidden_modules = ["ninja", "core.http", "modules.*.dto", "modules.*.controllers"]

[[tool.importlinter.contracts]]
name = "Core imports no module"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["modules", "config"]

# --- Coverage (testing_strategy.md §6; per-folder gates in scripts/check_coverage.py) ---
[tool.coverage.run]
branch = true
source = ["core", "config", "modules"]
omit = ["*/migrations/*", "*/tests/*", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ['if TYPE_CHECKING:', '\.\.\.$']
